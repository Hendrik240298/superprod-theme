<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Super Productivity theme contract fixture (not the application)</title>
  <style>
    /* Small DOM/cascade fixture modelled on SP 19.2.0. Real-app checks are separate. */
    :root { --font-primary-stack: "Open Sans", sans-serif; --component-max-width: 960px; }
    * { box-sizing: border-box; }
    body { margin: 0; --bg: #f8f8f7; --text-color: #2c2c2c; background: var(--bg); color: var(--text-color); font-family: var(--font-primary-stack); }
    body.isDarkTheme { --surface-1: #131314; --surface-2: #242424; --ink: #e6e6e6; --sidenav-bg: transparent; --task-c-bg: transparent; --task-c-selected-bg: #333333; --task-c-current-bg: #353535; --task-c-multi-selected-bg: #404040; --task-separator: 1px solid #444; --task-border-radius: 0px; --task-inner-padding-top-bottom: 4px; --task-first-line-min-height: 40px; --sidenav-active-text: #ffffff; --sidenav-item-active-bg: #333333; --focus-ring-width: 2px; --palette-primary-400: #b48aff; }
    body.isDarkTheme { --bg: var(--surface-1); --text-color: var(--ink); }
    .app-container { display: flex; min-height: 100vh; }
    magic-side-nav { display: block; flex: 0 0 240px; }
    .nav-sidenav { padding: 20px 8px; height: 100%; background: var(--sidenav-bg); }
    .nav-link { display: flex; width: 100%; align-items: center; gap: 12px; border: none; padding: 8px 16px; border-radius: 6px; background: transparent; color: inherit; font: inherit; }
    .nav-link.active { background: var(--sidenav-item-active-bg); color: var(--sidenav-active-text); }
    .main-content { flex: 1; min-width: 0; }
    main-header { display: block; padding: 24px; }
    .mat-icon { font-family: "Material Icons"; }
    .task-list-wrapper { max-width: var(--component-max-width); margin: auto; padding: 16px; }
    task-list, task, swipe-block, done-toggle { display: block; }
    task { position: relative; border-top: var(--task-separator); }
    task:focus { outline: none; }
    task > swipe-block > .inner-wrapper > .inner-wrapper { position: relative; padding: var(--task-inner-padding-top-bottom) 0; }
    .box { position: absolute; inset: 0; background: var(--task-c-bg); border-radius: var(--task-border-radius); }
    task.isSelected > swipe-block > .inner-wrapper > .inner-wrapper > .box { background: var(--task-c-selected-bg) !important; }
    task.isCurrent > swipe-block > .inner-wrapper > .inner-wrapper > .box { background: var(--task-c-current-bg); }
    task.isMultiSelected > swipe-block > .inner-wrapper > .inner-wrapper > .box { background: var(--task-c-multi-selected-bg); outline: 1px solid var(--palette-primary-400); }
    task:focus-visible > swipe-block > .inner-wrapper > .inner-wrapper > .box { outline: 2px solid var(--palette-primary-400); outline-offset: -2px; }
    .first-line { position: relative; display: flex; align-items: center; min-height: var(--task-first-line-min-height); }
    done-toggle { width: 40px; min-width: 40px; height: 40px; padding: 9px; }
    .done-shape { stroke: currentColor; stroke-width: 2; fill: none; opacity: .3; }
    .done-check { stroke: currentColor; fill: none; stroke-width: 2; stroke-dasharray: 18; stroke-dashoffset: 18; opacity: .3; }
    task-title { flex: 1; min-width: 0; }
    .display-value { overflow-wrap: anywhere; }
    task.isDone task-title { opacity: .6; text-decoration: line-through; }
    .tag { color: #8dd4a2; }
    .mat-mdc-menu-panel, .mat-mdc-dialog-surface { background: #fafafa; color: #111; padding: 16px; }
    .mat-mdc-menu-panel { position: fixed; right: 24px; top: 80px; }
    .mat-mdc-menu-item { display: block; color: inherit; background: transparent; border: none; padding: 10px; }
    .mat-mdc-unelevated-button { background: var(--mdc-filled-button-container-color, #7c4dff); color: var(--mdc-filled-button-label-text-color, #fff); border: none; padding: 8px 16px; }
    input { font: inherit; padding: 8px; }
    @media (max-width: 599px) { magic-side-nav { flex-basis: 0; } .nav-sidenav { position: fixed; width: 280px; left: -280px; } }
  </style>
</head>
<body class="isDarkTheme isMousePrimary">
  <div class="app-container">
    <magic-side-nav><nav class="nav-sidenav" aria-label="Main navigation">
      <button class="nav-link active">Today</button><button class="nav-link">Inbox</button><button class="nav-link">Planner</button>
    </nav></magic-side-nav>
    <main class="main-content">
      <main-header><h1>Today</h1><span class="mat-icon">wb_sunny</span></main-header>
      <section class="task-list-wrapper" aria-label="Tasks">
        <task-list>
          <task id="parent" tabindex="0"><swipe-block><div class="inner-wrapper"><div class="inner-wrapper"><div class="box"></div>
            <div class="first-line"><done-toggle role="checkbox" tabindex="0" aria-label="Complete task" aria-checked="false"><svg class="done-toggle-svg" viewBox="0 0 24 24"><rect class="done-shape" x="2.5" y="2.5" width="19" height="19" rx="5.5" ry="5.5"></rect><path class="done-check" d="m7 12 3 3 7-7"></path></svg></done-toggle><task-title><span class="display-value">Plan a focused day</span></task-title><span class="tag">Work</span></div>
            <div class="sub-tasks"><task id="child" tabindex="0"><swipe-block><div class="inner-wrapper"><div class="inner-wrapper"><div class="box"></div><div class="first-line"><task-title>Choose one important thing</task-title></div></div></div></swipe-block></task></div>
          </div></div></swipe-block></task>
          <task id="other" tabindex="0"><swipe-block><div class="inner-wrapper"><div class="inner-wrapper"><div class="box"></div><div class="first-line"><task-title><span class="display-value">A long task title stays readable on a narrow screen without losing its controls</span></task-title></div></div></div></swipe-block></task>
        </task-list>
        <button class="mat-mdc-unelevated-button mat-primary">Add task</button>
        <input aria-label="Task title" placeholder="What needs to get done?">
      </section>
    </main>
  </div>
</body>
</html>
